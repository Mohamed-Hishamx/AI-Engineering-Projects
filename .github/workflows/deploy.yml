name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'cli-to-saas/docs-qa-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railwayapp/railway-github-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: docs-qa-backend